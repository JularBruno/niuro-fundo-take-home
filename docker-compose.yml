services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: loanapp
      POSTGRES_PASSWORD: loanapp
      POSTGRES_DB: loanapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanapp"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
